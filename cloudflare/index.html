<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Trace</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #08090b;
            --panel: #14171c;
            --panel-border: #2a3038;
            --text: #f5f7fa;
            --muted: #9aa4b2;
            --accent: #5cc8ff;
            --error: #ff8b8b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            padding: 0;
            width: 100%;
        }

        body {
            align-items: center;
            background: var(--background);
            color: var(--text);
            display: flex;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            justify-content: center;
            padding: 28px;
        }

        main {
            display: grid;
            gap: 18px;
            max-width: 1100px;
            width: 100%;
        }

        h1,
        h2 {
            letter-spacing: 0;
            margin: 0;
        }

        h1 {
            font-size: clamp(24px, 4vw, 42px);
            text-align: center;
        }

        .summary {
            color: var(--muted);
            line-height: 1.5;
            margin: 0;
            text-align: center;
        }

        .panels {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        section {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            min-width: 0;
            overflow: hidden;
        }

        h2 {
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            font-size: 20px;
            gap: 10px;
            justify-content: space-between;
            padding: 16px 18px;
        }

        .status {
            color: var(--muted);
            font-size: 13px;
            font-weight: 400;
        }

        .status.error {
            color: var(--error);
        }

        dl {
            display: grid;
            grid-template-columns: minmax(130px, 0.45fr) minmax(0, 1fr);
            margin: 0;
        }

        dt,
        dd {
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            margin: 0;
            min-width: 0;
            padding: 10px 14px;
        }

        dt {
            color: var(--muted);
            text-align: right;
        }

        dd {
            color: var(--text);
        }

        button.copy-value {
            appearance: none;
            background: transparent;
            border: 0;
            color: inherit;
            cursor: pointer;
            display: block;
            font: inherit;
            line-height: 1.35;
            min-height: 20px;
            overflow-wrap: anywhere;
            padding: 0;
            text-align: left;
            width: 100%;
        }

        button.copy-value:hover,
        button.copy-value:focus-visible {
            color: var(--accent);
            outline: none;
        }

        .empty {
            color: var(--muted);
        }

        #toast-container {
            align-items: center;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            left: 50%;
            position: fixed;
            transform: translateX(-50%);
            z-index: 9999;
        }

        .toast {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 15px;
            max-width: min(90vw, 760px);
            opacity: 0;
            overflow-wrap: anywhere;
            padding: 12px 20px;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 820px) {
            body {
                align-items: flex-start;
                padding: 18px;
            }

            .panels {
                grid-template-columns: 1fr;
            }

            dl {
                grid-template-columns: 1fr;
            }

            dt {
                border-bottom: 0;
                padding-bottom: 2px;
                text-align: left;
            }

            dd {
                padding-top: 2px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Cloudflare Trace</h1>
        <p class="summary">
            IPv4 and IPv6 trace endpoints are selected randomly. Click any value to copy it.
        </p>
        <div class="panels" id="panels"></div>
    </main>

    <script type="application/javascript">
        const lookupGroups = [
            {
                key: "ipv4",
                title: "IPv4",
                urls: [
                    "https://1.1.1.1/cdn-cgi/trace",
                    "https://1.0.0.1/cdn-cgi/trace"
                ]
            },
            {
                key: "ipv6",
                title: "IPv6",
                urls: [
                    "https://[2606:4700:4700::1111]/cdn-cgi/trace",
                    "https://[2606:4700:4700::1001]/cdn-cgi/trace",
                    "https://[2606:4700:4700::1112]/cdn-cgi/trace",
                    "https://[2606:4700:4700::1002]/cdn-cgi/trace",
                    "https://[2606:4700:4700::1113]/cdn-cgi/trace",
                    "https://[2606:4700:4700::1003]/cdn-cgi/trace"
                ]
            }
        ];

        const panels = document.getElementById("panels");

        function pickRandom(items) {
            return items[Math.floor(Math.random() * items.length)];
        }

        function parseTrace(text) {
            return text
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line) => {
                    const separatorIndex = line.indexOf("=");
                    if (separatorIndex === -1) {
                        return [line, ""];
                    }

                    return [
                        line.slice(0, separatorIndex),
                        line.slice(separatorIndex + 1)
                    ];
                });
        }

        function renderPanel(lookup) {
            const section = document.createElement("section");
            section.id = lookup.key;

            const heading = document.createElement("h2");
            heading.textContent = lookup.title;

            const status = document.createElement("span");
            status.className = "status";
            status.textContent = "loading";
            heading.appendChild(status);

            const list = document.createElement("dl");
            section.append(heading, list);
            panels.appendChild(section);
        }

        function appendCopyRow(list, key, value) {
            const term = document.createElement("dt");
            term.textContent = key;

            const description = document.createElement("dd");
            const button = document.createElement("button");
            button.type = "button";
            button.className = "copy-value";
            button.disabled = !value;
            button.textContent = value || "unknown";
            button.classList.toggle("empty", !value);

            description.appendChild(button);
            list.append(term, description);
        }

        function setPanelData(key, url, rows) {
            const section = document.getElementById(key);
            const status = section.querySelector(".status");
            const list = section.querySelector("dl");
            list.textContent = "";

            appendCopyRow(list, "url", url);
            rows.forEach(([traceKey, value]) => appendCopyRow(list, traceKey, value));

            status.textContent = "ready";
            status.classList.remove("error");
        }

        function setPanelError(key, url, message) {
            const section = document.getElementById(key);
            const status = section.querySelector(".status");
            const list = section.querySelector("dl");
            list.textContent = "";

            appendCopyRow(list, "url", url);
            appendCopyRow(list, "error", message);

            status.textContent = "not reachable";
            status.classList.add("error");
        }

        async function loadTrace(lookup) {
            const url = pickRandom(lookup.urls);
            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch(url, {
                    cache: "no-store",
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                setPanelData(lookup.key, url, parseTrace(text));
            } catch (error) {
                const message = error.name === "AbortError" ? "request timed out" : error.message;
                setPanelError(lookup.key, url, message || "request failed");
            } finally {
                window.clearTimeout(timeout);
            }
        }

        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }

            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
        }

        document.addEventListener("click", async (event) => {
            const button = event.target.closest(".copy-value");
            if (!button || button.disabled) {
                return;
            }

            try {
                await copyText(button.textContent);
                showToast("Copied: " + button.textContent, 1000);
            } catch (error) {
                showToast("Copy failed", 1500);
            }
        });

        function getToastContainer() {
            let container = document.getElementById("toast-container");
            if (!container) {
                container = document.createElement("div");
                container.id = "toast-container";
                document.body.appendChild(container);
            }
            return container;
        }

        function showToast(message, duration = 3000) {
            const container = getToastContainer();
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add("show"));
            setTimeout(() => {
                toast.classList.remove("show");
                toast.addEventListener("transitionend", () => toast.remove());
            }, duration);
        }

        lookupGroups.forEach((lookup) => {
            renderPanel(lookup);
            loadTrace(lookup);
        });
    </script>
</body>

</html>
