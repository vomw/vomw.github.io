<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Load Content from File without Extension</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #content { border: 1px solid #ccc; padding: 10px; }
  </style>
</head>
<body>
  <h1>Loaded Content</h1>
  <div id="content">Loading...</div>

  <script>
    // Fetch the file named 'content' (without an extension)
    fetch('ivfCtNR5655gKkrrCBPCn3xO_BU51frwrJNpfDv2reI')
      .then(response => {
        if (!response.ok) {
          throw new Error("Network response was not ok: " + response.statusText);
        }
        return response.text();
      })
      .then(text => {
        document.getElementById("content").innerText = text;
      })
      .catch(error => {
        console.error("Error fetching the file:", error);
        document.getElementById("content").innerText = "Error loading content.";
      });
  </script>
  <script type="text/javascript">
  (function(l) {
    if (l.search[1] === '/' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&')
      }).join('?');
      window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
  }(window.location))
</script>
</body>
</html>
